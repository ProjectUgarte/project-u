<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .letter { fill: #1a1a2e; }
    .paren { fill: #4a90a4; }
    @media (prefers-color-scheme: dark) {
      .letter { fill: #fafafa; }
    }
  </style>
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="72" letter-spacing="-3">
    <tspan class="paren">(</tspan><tspan class="letter">u</tspan><tspan class="paren">)</tspan>
  </text>
</svg>

  <style>
    .not-found {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--spacing-xl) var(--spacing-md);
    }
    .not-found__code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      color: var(--color-text);
    }
    .not-found__code .accent {
      color: var(--color-accent);
    }
    .not-found__message {
      font-size: var(--font-size-lg);
      color: var(--color-text-muted);
      margin: var(--spacing-sm) 0 var(--spacing-lg);
    }
  </style>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">project<span class="nav__logo-paren">(</span>u<span class="nav__logo-paren">)</span></a>
    </div>
  </nav>

  <main class="not-found">
    <p class="not-found__code">4<span class="accent">(</span>0<span class="accent">)</span>4</p>
    <p class="not-found__message">This page wandered off — maybe a ball trapped it behind a wall.</p>
    <a href="/" class="btn btn--primary">Back to Home</a>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
